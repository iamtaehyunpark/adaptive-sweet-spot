[app]
id = "ass-web"
name = "Adaptive Sweet Spot"
version = "0.1.0"
description = "Real-time spatial audio system with adaptive 5.1 sweet-spot steering"
mode = "webapp"
exec = "python tools/app.py --port 8765 --no-browser"
cwd = "."
env_manager = "uv"

[ui]
default_layout = "tab"

[resources]
requires_gpu = false
isolated_cache = false
graceful_timeout_ms = 3000
kill_timeout_ms = 2000

[environment]
secrets = []

[environment.vars]

[artifacts]
output_dir = "./outputs"
scratch_globs = []

[inputs.camera]
type = "string"
cli_flag = "--camera"
label = "Camera index"
description = "Camera device index (empty = from config)"
required = false

[inputs.no_camera]
type = "bool"
cli_flag = "--no-camera"
bool_style = "flag_only"
label = "Disable camera"
description = "No tracking, only the 3D room / speaker placement"
default = false

[inputs.no_dsp]
type = "bool"
cli_flag = "--no-dsp"
bool_style = "flag_only"
label = "Disable DSP"
description = "Don't start the sweet-spot DSP process"
default = false

[inputs.no_stream]
type = "bool"
cli_flag = "--no-stream"
bool_style = "flag_only"
label = "Disable UDP bridge"
description = "Don't publish detections on the UDP bridge"
default = false

[inputs.audio_device]
type = "string"
cli_flag = "--audio-device"
label = "Audio device"
description = "DSP output device (index or name substring; empty = default)"
required = false
