# Default system configuration. Copy to config/local.toml to override per setup.
# Room frame: meters, origin = designated center, +x right, +y front, +z up.
# Azimuth: degrees clockwise from front (+y).

[audio]
sample_rate = 48000
block_size = 128          # 2.67 ms @ 48 kHz
channels = 6
device = ""               # substring of output device name; "" = system default
speed_of_sound = 343.0    # m/s

# Logitech Z906, ITU-R BS.775-style placement (measure and replace).
[[speakers]]
name = "FL"
channel = 0
azimuth_deg = -30
distance_m = 2.0
height_m = 0.0
trim_db = 0.0

[[speakers]]
name = "FR"
channel = 1
azimuth_deg = 30
distance_m = 2.0
height_m = 0.0
trim_db = 0.0

[[speakers]]
name = "FC"
channel = 2
azimuth_deg = 0
distance_m = 2.0
height_m = 0.0
trim_db = 0.0

[[speakers]]
name = "LFE"
channel = 3
azimuth_deg = 20
distance_m = 2.2
height_m = -0.8
trim_db = 0.0
lfe = true

[[speakers]]
name = "SL"
channel = 4
azimuth_deg = -110
distance_m = 1.8
height_m = 0.0
trim_db = 0.0

[[speakers]]
name = "SR"
channel = 5
azimuth_deg = 110
distance_m = 1.8
height_m = 0.0
trim_db = 0.0

[listener]
default_position = [0.0, 0.0, 0.0]
max_offset_m = 1.5

[vision]
camera_index = 0
width = 1280
height = 720
fps = 30
hfov_deg = 70.0            # only used before calibration (tools/m2_2_spatial_check.py, key k)
ipd_m = 0.063              # listener interpupillary distance; set your own for best lateral accuracy
model_path = "assets/models/blaze_face_full_range.tflite"   # or blaze_face_short_range.tflite
min_confidence = 0.5
roi_scale = 4.0             # tracking crop = roi_scale x face width
search_levels = [1, 2, 3]   # when no face: full frame, then 2x2, then 3x3 tiles
adaptive_rate = true        # detect only as often as head motion needs (vision/rate.py)
tolerance_mm = 30.0         # allowed position error (~0.1 ms L/R arrival error)
min_fps = 15.0              # detection rate floor when the head is still (also how fast a move is noticed)

# Milestone 2.2 assumes the camera sits on top of the FC speaker, level, facing the listener.

[bridge]
udp_host = "127.0.0.1"
udp_port = 9750

# Sweet-spot DSP (dsp/, run with tools/dsp.py or from the app's Sound tab).
[dsp]
mode = "tracking"           # bypass | static (centered on the seat) | tracking (follows the listener)
volume_db = -12.0           # master volume at start
virtual_yaw = true          # virtual surround: speakers stay put when you turn your head (camera yaw)
render = "auto"             # auto | speakers (6-ch DAC) | virtual (virtual surround over stereo/headphones) | downmix
control_port = 9751         # local UDP control (dsp/control.py)
max_delay_s = 0.04          # delay line length (13.7 m of path)
slew = 0.002                # max delay change, s per s (= 0.2 % pitch shift, inaudible)
gain_tau_s = 0.05           # level change smoothing
level_compensation = true   # inverse-distance level matching
offaxis_eq = true           # treble shelf for speakers the listener moved off-axis from
offaxis_max_db = 3.0        # boost at >= offaxis_full_deg off the speaker's axis
offaxis_full_deg = 30.0
shelf_hz = 3000.0
min_cutoff_hz = 1.5         # One Euro smoothing of the tracked position (still head)
beta = 6.0                  # ... cutoff rises by beta Hz per m/s of head speed
predict = false             # extrapolate to when the sound is heard: at ~10-30 detections/s the
max_predict_s = 0.1         #   velocity lags, overshoots when you stop (+~200 ms settling) - off
position_tau_s = 0.025      # audio-rate smoothing of the position steps (no ticking when moving)
input_device = ""           # for the "input" source (live pass-through), e.g. "BlackHole"
