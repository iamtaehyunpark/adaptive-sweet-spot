[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-sweet-spot"
version = "0.1.0"
description = "Webcam-tracked adaptive 5.1 sweet-spot steering"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4", "soundfile>=0.12"]
vision = ["mediapipe>=0.10", "opencv-python>=4.8"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["config", "dsp", "vision", "interface"]

[tool.setuptools.package-data]
config = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
